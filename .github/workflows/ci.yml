name: Build & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Compile Kotlin JVM
        run: .\gradlew.bat compileKotlinJvm --stacktrace

      - name: Run Unit Tests
        run: .\gradlew.bat jvmTest --stacktrace

      - name: Build Standalone Distribution Package
        run: .\gradlew.bat packageUberJarForCurrentOS --stacktrace
